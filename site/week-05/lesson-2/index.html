  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

border-radius:8px;padding:3px 6px;font:750 16px/1.3 var(--font);max-width:100%;cursor:pointer\">\n<option value=\"w01\" style=\"color:#1B1A18\">Week 1 · What is Responsible HAII?<\u002Foption>\n<option value=\"w02\" style=\"color:#1B1A18\">Week 2 · How AI works, and how people think it works<\u002Foption>\n<option value=\"w03\" style=\"color:#1B1A18\">Week 3 · Why AI breaks UX<\u002Foption>\n<option value=\"w04\" style=\"color:#1B1A18\">Week 4 · What counts as harm<\u002Foption>\n<option value=\"w05\" style=\"color:#1B1A18\">Week 5 · Good enough at 85%<\u002Foption>\n<option value=\"w6\" disabled=\"{{ true }}\" style=\"color:#1B1A18\">Week 6 · not yet posted<\u002Foption>\n<option value=\"w7\" disabled=\"{{ true }}\" style=\"color:#1B1A18\">Week 7 · not yet posted<\u002Foption>\n<option value=\"w8\" disabled=\"{{ true }}\" style=\"color:#1B1A18\">Week 8 · not yet posted<\u002Foption>\n<option value=\"w9\" disabled=\"{{ true }}\" style=\"color:#1B1A18\">Week 9 · not yet posted<\u002Foption>\n<option value=\"w10\" disabled=\"{{ true }}\" style=\"color:#1B1A18\">Week 10 · not yet posted<\u002Foption>\n<option value=\"w11\" disabled=\"{{ true }}\" style=\"color:#1B1A18\">Week 11 · not yet posted<\u002Foption>\n<option value=\"w12\" disabled=\"{{ true }}\" style=\"color:#1B1A18\">Week 12 · not yet posted<\u002Foption>\n<option value=\"w13\" disabled=\"{{ true }}\" style=\"color:#1B1A18\">Week 13 · not yet posted<\u002Foption>\n<option value=\"w14\" disabled=\"{{ true }}\" style=\"color:#1B1A18\">Week 14 · not yet posted<\u002Foption>\n<option value=\"w15\" disabled=\"{{ true }}\" style=\"color:#1B1A18\">Week 15 · not yet posted<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<p style=\"font-size:var(--text-pill);opacity:.75;margin:0 0 var(--space-7);line-height:1.4\">Whether the thing you want to build can be built, and whether it should be.<\u002Fp>\n<a href=\"{{ ovHref }}\" style=\"display:block;padding:9px 11px;margin:0 0 14px;border-radius:8px;font:500 13.5px/1.35 var(--font);color:var(--on-brand-soft);text-decoration:none;background:rgba(255,255,255,.07);transition:var(--transition-hover)\" style-hover=\"background:rgba(255,255,255,.12)\">▸ Week Overview<\u002Fa>\n<p style=\"font-size:var(--text-clo);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;opacity:.6;margin:0 0 var(--space-3)\">Lessons this week<\u002Fp>\n<ol style=\"list-style:none;margin:0 0 var(--space-7);padding:0\">\n<li style=\"margin:0 0 var(--space-1)\">\n<a href=\"{{ rl0Href }}\" style=\"display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:var(--radius-btn);text-decoration:none;font-size:13.5px;line-height:var(--leading-compact);transition:var(--transition-hover);background:transparent;color:var(--on-brand-soft)\" style-hover=\"background:rgba(255,255,255,.08)\">\n<span style=\"font:11px var(--mono);opacity:.6;padding-top:2px;min-width:14px\">1<\u002Fspan>\n<span style=\"flex:1\">What AI can do<span style=\"{{ rl0DoneShow }}\"><span style=\"color:var(--on-brand-check)\"> ✓<\u002Fspan><\u002Fspan>\n<span style=\"{{ rl0MetaShow }}\"><span style=\"display:block;font-size:var(--text-eyebrow);opacity:.6;margin-top:2px\">{{ rl0Meta }}<\u002Fspan><\u002Fspan>\n<\u002Fspan>\n<\u002Fa>\n<\u002Fli>\n<li style=\"margin:0 0 var(--space-1)\">\n<a href=\"{{ rl1Href }}\" style=\"display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:var(--radius-btn);text-decoration:none;font-size:13.5px;line-height:var(--leading-compact);transition:var(--transition-hover);background:var(--accent);color:#fff\">\n<span style=\"font:11px var(--mono);opacity:.85;padding-top:2px;min-width:14px\">2<\u002Fspan>\n<span style=\"flex:1\">How well it has to work<span style=\"{{ rl1DoneShow }}\"><span style=\"color:#fff\"> ✓<\u002Fspan><\u002Fspan>\n<span style=\"{{ rl1MetaShow }}\"><span style=\"display:block;font-size:var(--text-eyebrow);opacity:.85;margin-top:2px\">{{ rl1Meta }}<\u002Fspan><\u002Fspan>\n<\u002Fspan>\n<\u002Fa>\n<\u002Fli>\n<li style=\"margin:0 0 var(--space-1)\">\n<a href=\"{{ rl2Href }}\" style=\"display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:var(--radius-btn);text-decoration:none;font-size:13.5px;line-height:var(--leading-compact);transition:var(--transition-hover);background:transparent;color:var(--on-brand-soft)\" style-hover=\"background:rgba(255,255,255,.08)\">\n<span style=\"font:11px var(--mono);opacity:.6;padding-top:2px;min-width:14px\">3<\u002Fspan>\n<span style=\"flex:1\">Asking people about it<span style=\"{{ rl2DoneShow }}\"><span style=\"color:var(--on-brand-check)\"> ✓<\u002Fspan><\u002Fspan>\n<span style=\"{{ rl2MetaShow }}\"><span style=\"display:block;font-size:var(--text-eyebrow);opacity:.6;margin-top:2px\">{{ rl2Meta }}<\u002Fspan><\u002Fspan>\n<\u002Fspan>\n<\u002Fa>\n<\u002Fli>\n<\u002Fol>\n<div>\n<div style=\"height:5px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden\">\n<div style=\"{{ progFill }}\"><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:var(--text-eyebrow);opacity:.6;margin:6px 0 0\">3 lessons · ~60 min video<\u002Fp>\n<\u002Fdiv>\n<a href=\"{{ ovHref }}\" style=\"display:block;margin-top:var(--space-7);padding-top:var(--space-6);border-top:1px solid var(--brand-rule);color:var(--on-brand-quiet);font-size:var(--text-meta);text-decoration:none\">← Week overview &amp; deadlines<\u002Fa>\n<\u002Faside>\n<main id=\"main\" style=\"margin-left:262px;padding:34px 40px 90px;max-width:1162px\">\n<p style=\"font-family:var(--font);font-size:var(--text-pill);color:var(--ink-soft);margin:0 0 var(--space-4)\">Week 5 · Lesson 2<\u002Fp>\n<h1 style=\"font-size:30px;letter-spacing:-.01em;line-height:1.25;margin:0 0 .4em\">How well it has to work<\u002Fh1>\n<p style=\"font-size:17px;color:#5C5850;margin:0 0 26px;text-wrap:pretty\">Most useful AI is only moderately good. What decides whether that is fine is not the number; it is who receives the wrong answer, and what it costs them.<\u002Fp>\n\n<section style=\"margin:0 0 34px\">\n<div style=\"display:flex;gap:var(--space-4);align-items:center;margin:0 0 var(--space-5);font-family:var(--font)\"><span style=\"width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:12px/1 var(--mono);font-weight:var(--weight-bold);flex:none\">1<\u002Fspan><h2 style=\"font-size:var(--text-section);margin:0;line-height:var(--leading-tight);color:var(--ink)\">Overview<\u002Fh2><\u002Fdiv>\n<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:var(--pad-card);font-family:var(--font);color:var(--ink);font-size:var(--text-base);line-height:var(--leading-body)\">\n<p style=\"margin:0;text-wrap:pretty\">This lesson is about how well your AI should be: most useful AI is only moderately good, and 25 of the paper's 40 real products sit below 90% accuracy. What decides whether that is fine is not the number. It is who receives the wrong answer, and what it costs them.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin:0 0 34px\">\n<div style=\"display:flex;gap:var(--space-4);align-items:center;margin:0 0 var(--space-5);font-family:var(--font)\"><span style=\"width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:12px/1 var(--mono);font-weight:var(--weight-bold);flex:none\">2<\u002Fspan><h2 style=\"font-size:var(--text-section);margin:0;line-height:var(--leading-tight);color:var(--ink)\">What you'll be able to do<\u002Fh2><\u002Fdiv>\n<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:var(--pad-card);font-family:var(--font);color:var(--ink);font-size:var(--text-base);line-height:var(--leading-body)\">\n\n<ul style=\"list-style:none;margin:0;padding:0;font-family:var(--font)\">\n<li style=\"display:flex;gap:11px;padding:10px 0;font-size:var(--text-list);border-bottom:1px solid var(--line);line-height:var(--leading-body)\">\n<span style=\"color:var(--accent);font-weight:var(--weight-heavy)\">→<\u002Fspan>\n<span style=\"flex:1\">Place a named AI feature on the Task Expertise × AI Performance matrix, and say what performance it needs before anyone would use it<\u002Fspan>\n<span sc-camel-tab-index=\"0\" style=\"font-family:var(--font);font-size:var(--text-clo);color:var(--ink-soft);border:1px solid var(--line);border-radius:var(--radius-pill);padding:1px 7px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;position:relative;align-self:center\" style-hover=\"border-color:var(--accent);color:var(--accent)\">CLO 1<span data-clotip=\"\" style=\"position:absolute;right:0;left:auto;bottom:calc(100% + 7px);width:270px;max-width:min(270px,70vw);white-space:normal;background:var(--ink);color:#fff;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.45;letter-spacing:0;text-transform:none;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;visibility:hidden;transition:opacity 120ms ease;pointer-events:none;z-index:40\">Define and explain fundamental HCI and HAII/HAX theories and design principles and articulate the importance of adopting ethics in HCI and HAII/HAX.<\u002Fspan><\u002Fspan>\n<span sc-camel-tab-index=\"0\" style=\"font-family:var(--font);font-size:var(--text-clo);color:var(--ink-soft);border:1px solid var(--line);border-radius:var(--radius-pill);padding:1px 7px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;position:relative;align-self:center\" style-hover=\"border-color:var(--accent);color:var(--accent)\">CLO 3<span data-clotip=\"\" style=\"position:absolute;right:0;left:auto;bottom:calc(100% + 7px);width:270px;max-width:min(270px,70vw);white-space:normal;background:var(--ink);color:#fff;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.45;letter-spacing:0;text-transform:none;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;visibility:hidden;transition:opacity 120ms ease;pointer-events:none;z-index:40\">Describe and apply relevant HCI and HAII/HAX theories and principles to new designing activities, including designing to improve user experience and address user needs.<\u002Fspan><\u002Fspan>\n<\u002Fli>\n<li style=\"display:flex;gap:11px;padding:10px 0;font-size:var(--text-list);border-bottom:1px solid var(--line);line-height:var(--leading-body)\">\n<span style=\"color:var(--accent);font-weight:var(--weight-heavy)\">→<\u002Fspan>\n<span style=\"flex:1\">Say what happens to a named person when your candidate runs at 85%<\u002Fspan>\n<span sc-camel-tab-index=\"0\" style=\"font-family:var(--font);font-size:var(--text-clo);color:var(--ink-soft);border:1px solid var(--line);border-radius:var(--radius-pill);padding:1px 7px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;position:relative;align-self:center\" style-hover=\"border-color:var(--accent);color:var(--accent)\">CLO 1<span data-clotip=\"\" style=\"position:absolute;right:0;left:auto;bottom:calc(100% + 7px);width:270px;max-width:min(270px,70vw);white-space:normal;background:var(--ink);color:#fff;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.45;letter-spacing:0;text-transform:none;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;visibility:hidden;transition:opacity 120ms ease;pointer-events:none;z-index:40\">Define and explain fundamental HCI and HAII/HAX theories and design principles and articulate the importance of adopting ethics in HCI and HAII/HAX.<\u002Fspan><\u002Fspan>\n<span sc-camel-tab-index=\"0\" style=\"font-family:var(--font);font-size:var(--text-clo);color:var(--ink-soft);border:1px solid var(--line);border-radius:var(--radius-pill);padding:1px 7px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;position:relative;align-self:center\" style-hover=\"border-color:var(--accent);color:var(--accent)\">CLO 2<span data-clotip=\"\" style=\"position:absolute;right:0;left:auto;bottom:calc(100% + 7px);width:270px;max-width:min(270px,70vw);white-space:normal;background:var(--ink);color:#fff;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.45;letter-spacing:0;text-transform:none;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;visibility:hidden;transition:opacity 120ms ease;pointer-events:none;z-index:40\">Perform user experience investigation, analyze requirements for system design, and perform a usability test.<\u002Fspan><\u002Fspan>\n<\u002Fli>\n<li style=\"display:flex;gap:11px;padding:10px 0;font-size:var(--text-list);line-height:var(--leading-body)\">\n<span style=\"color:var(--accent);font-weight:var(--weight-heavy)\">→<\u002Fspan>\n<span style=\"flex:1\">Decide automate or augment for one task in your candidate using the Guidebook’s three research questions, and state the fact that would flip the decision<\u002Fspan>\n<span sc-camel-tab-index=\"0\" style=\"font-family:var(--font);font-size:var(--text-clo);color:var(--ink-soft);border:1px solid var(--line);border-radius:var(--radius-pill);padding:1px 7px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;position:relative;align-self:center\" style-hover=\"border-color:var(--accent);color:var(--accent)\">CLO 3<span data-clotip=\"\" style=\"position:absolute;right:0;left:auto;bottom:calc(100% + 7px);width:270px;max-width:min(270px,70vw);white-space:normal;background:var(--ink);color:#fff;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.45;letter-spacing:0;text-transform:none;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;visibility:hidden;transition:opacity 120ms ease;pointer-events:none;z-index:40\">Describe and apply relevant HCI and HAII/HAX theories and principles to new designing activities, including designing to improve user experience and address user needs.<\u002Fspan><\u002Fspan>\n<\u002Fli>\n<\u002Ful>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin:0 0 34px\">\n<div style=\"display:flex;gap:var(--space-4);align-items:center;margin:0 0 var(--space-5);font-family:var(--font)\"><span style=\"width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:12px/1 var(--mono);font-weight:var(--weight-bold);flex:none\">3<\u002Fspan><h2 style=\"font-size:var(--text-section);margin:0;line-height:var(--leading-tight);color:var(--ink)\">Before you start<\u002Fh2><\u002Fdiv>\n<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:var(--pad-card);font-family:var(--font);color:var(--ink);font-size:var(--text-base);line-height:var(--leading-body)\">\n\n<p style=\"margin:0 0 12px;text-wrap:pretty\"> Yildirim et al. (2023), <b>section 5.4 with Figure 4<\u002Fb>, and <b>section 7.2<\u002Fb>. That is the half of the excerpt Lesson 1 did not use.<\u002Fp>\n<p style=\"margin:0 0 12px;text-wrap:pretty\"> People + AI Guidebook, <i>User Needs + Defining Success<\u002Fi>, <b>section 2<\u002Fb>.<b><\u002Fb><\u002Fp>\n\n<div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start\">\n<a href=\"{{ paperUrl }}\" style=\"display:inline-block;border:0;cursor:pointer;text-decoration:none;font-family:var(--font);font-weight:var(--weight-medium);border-radius:var(--radius-btn);transition:var(--transition-hover);line-height:1.2;padding:9px 17px;font-size:var(--text-option);background:var(--action-primary);color:#fff\">Open the paper · PDF →<\u002Fa>\n<a href=\"{{ pairUrl }}\" style=\"display:inline-block;border:0;cursor:pointer;text-decoration:none;font-family:var(--font);font-weight:var(--weight-medium);border-radius:var(--radius-btn);transition:var(--transition-hover);line-height:1.2;padding:9px 17px;font-size:var(--text-option);background:var(--surface);color:var(--brand);box-shadow:inset 0 0 0 1px var(--line)\">People + AI Guidebook →<\u002Fa>\n<span style=\"{{ hasRrLinkShow }}\">\n<a href=\"{{ rrUrl }}\" style=\"display:inline-block;border:0;cursor:pointer;text-decoration:none;font-family:var(--font);font-weight:var(--weight-medium);border-radius:var(--radius-btn);transition:var(--transition-hover);line-height:1.2;padding:9px 17px;font-size:var(--text-option);background:transparent;color:var(--brand)\">Reading Response #4 · Canvas →<\u002Fa>\n<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div id=\"player\" style=\"position:relative;width:100%;aspect-ratio:16/9;background:#14170F;border-radius:12px\">\n<div style=\"{{ pvBox }}\">\n<span style=\"{{ pvHasVideoShow }}\">\n<iframe title=\"How well it has to work\" src=\"{{ pvSrc }}\" allow=\"autoplay\" sc-camel-allow-full-screen=\"{{ true }}\" aria-label=\"Panopto embedded video player\" style=\"border:0;width:100%;height:100%;display:block\"><\u002Fiframe>\n<\u002Fspan>\n<span style=\"{{ pvPendingShow }}\">\n<div style=\"width:100%;height:100%;display:grid;gap:6px;justify-items:center;align-content:center;text-align:center;padding:16px;color:var(--on-brand-soft);font-family:var(--font);font-size:var(--text-option)\">\n<span>[ recording pending ]<\u002Fspan>\n\n<span style=\"{{ pvCueShow }}\"><span style=\"color:var(--accent);font:700 13px ui-monospace,Menlo,Consolas,monospace\">▸ queued at {{ pvCue }}<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fspan>\n<span style=\"{{ pvDockedShow }}\">\n<div style=\"position:absolute;top:6px;right:8px;display:flex;gap:6px\">\n<button type=\"button\" sc-camel-on-click=\"{{ pvBack }}\" style=\"font:600 11px/1 var(--font);color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:5px 9px;cursor:pointer\">back to player ↑<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ pvStop }}\" title=\"Stop the player following (audio keeps playing)\" aria-label=\"Stop the player following. Audio keeps playing; scroll back up to see it.\" style=\"font:600 12px/1 var(--font);color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);border-radius:99px;width:24px;height:24px;display:grid;place-items:center;cursor:pointer\">✕<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 0;min-height:22px\">\n<span style=\"{{ pvJumpedShow }}\"><span style=\"font:600 12px ui-monospace,Menlo,Consolas,monospace;color:var(--accent)\">▸ jumped to {{ pvCue }}<\u002Fspan><\u002Fspan>\n<span style=\"{{ pvStayShow }}\"><span style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--ink-soft)\">player is staying here, still playing<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"height:32px\"><\u002Fdiv>\n\n<section style=\"margin:0 0 34px\">\n<div style=\"display:flex;gap:var(--space-4);align-items:center;margin:0 0 var(--space-5);font-family:var(--font)\"><span style=\"width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:12px/1 var(--mono);font-weight:var(--weight-bold);flex:none\">4<\u002Fspan><h2 style=\"font-size:var(--text-section);margin:0;line-height:var(--leading-tight);color:var(--ink)\">Walkthrough<\u002Fh2><\u002Fdiv>\n<p style=\"color:#5C5850;font-size:14.5px;margin:-6px 0 14px\">Four chapters. Click a timestamp to jump the player there.<\u002Fp>\n<div style=\"display:grid;gap:12px\">\n\n<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:18px 20px\">\n<div style=\"display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px\">\n<button type=\"button\" sc-camel-on-click=\"{{ jump1 }}\" style=\"font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--accent);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:5px 9px;cursor:pointer;flex:none\">{{ t1 }}<\u002Fbutton>\n<h3 style=\"font:600 17px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;flex:1 1 240px\">Good enough<\u002Fh3>\n<\u002Fdiv>\n<p style=\"margin:0 0 .8em\">Speech recognition runs at about 90 to 95 percent accuracy, which means roughly one word per sentence comes out wrong, and captions and voicemail transcripts are still worth having, because before them nobody was transcribing at all and a rough transcript beats none. Yildirim and colleagues went back through their 40 real AI products with that in mind and found that 25 of them sit where moderate performance, below 90 percent, is enough to be useful.&nbsp;<\u002Fp>\n<div style=\"background:var(--surface-2);border-left:3px solid var(--brand);border-radius:0 6px 6px 0;padding:10px 13px;font-size:14.5px;line-height:1.6\">\n<p style=\"margin:0\"><b>The three bins,<\u002Fb> from the paper: <b>excellent<\u002Fb> above 99% · <b>good<\u002Fb> 90 to 99% · <b>moderate<\u002Fb> below 90%. <br>These describe the <b>minimum a person needs before they would use it<\u002Fb>, not the maximum a model could reach.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:18px 20px\">\n<div style=\"display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px\">\n<button type=\"button\" sc-camel-on-click=\"{{ jump2 }}\" style=\"font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--accent);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:5px 9px;cursor:pointer;flex:none\">{{ t2 }}<\u002Fbutton>\n<h3 style=\"font:600 17px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;flex:1 1 240px\">Two axes<\u002Fh3>\n<\u002Fdiv>\n<p style=\"margin:0 0 .9em\">Two things decide how good an AI has to be. How much expertise the task takes: a child could do it, a typical adult could, or it needs a professional. And how well the system must perform before anyone would use it: moderate, good, or excellent.&nbsp; Designers reach for the expert-and-excellent corner by default, which is both the hardest corner to build. Most of the real value sits on the left.<\u002Fp>\n\n<figure style=\"margin:0 0 .9em\" role=\"group\" aria-label=\"A three-by-three grid. The horizontal axis is how well the AI must perform, moderate to excellent; the vertical axis is how much expertise the task takes, a child could to a professional. Captions sit top-left, cancer detection top-right, face unlock middle-right, a step counter bottom-left.\">\n<div style=\"display:flex;gap:9px\">\n<div aria-hidden=\"true\" style=\"flex:none;display:flex;align-items:center;padding-bottom:34px\"><span style=\"writing-mode:vertical-rl;transform:rotate(180deg);font:600 12px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif\">How much expertise the task takes ↑<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1;min-width:0\">\n<div aria-hidden=\"true\" style=\"display:grid;gap:6px;grid-template-columns:minmax(78px,auto) repeat(3,minmax(0,1fr))\">\n<div style=\"display:flex;align-items:center;justify-content:flex-end;text-align:right;font:600 11.5px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink-soft);padding-right:3px\">a professional<\u002Fdiv>\n<div style=\"min-height:74px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px\"><span style=\"font:600 11.5px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--brand)\">Captions on a lecture<\u002Fspan><\u002Fdiv>\n<div style=\"min-height:74px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px\"><\u002Fdiv>\n<div style=\"min-height:74px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px\"><span style=\"font:600 11.5px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--brand)\">Cancer in a scan<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:flex-end;text-align:right;font:600 11.5px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink-soft);padding-right:3px\">a typical adult<\u002Fdiv>\n<div style=\"min-height:74px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px\"><\u002Fdiv>\n<div style=\"min-height:74px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px\"><\u002Fdiv>\n<div style=\"min-height:74px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px\"><span style=\"font:600 11.5px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--brand)\">Face unlock<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:flex-end;text-align:right;font:600 11.5px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink-soft);padding-right:3px\">a child could<\u002Fdiv>\n<div style=\"min-height:74px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px\"><span style=\"font:600 11.5px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--brand)\">A step counter<\u002Fspan><\u002Fdiv>\n<div style=\"min-height:74px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px\"><\u002Fdiv>\n<div style=\"min-height:74px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px\"><\u002Fdiv>\n<div><\u002Fdiv>\n<div style=\"font:600 11.5px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink-soft);text-align:center;padding-top:3px\">moderate<\u002Fdiv>\n<div style=\"font:600 11.5px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink-soft);text-align:center;padding-top:3px\">good<\u002Fdiv>\n<div style=\"font:600 11.5px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink-soft);text-align:center;padding-top:3px\">excellent<\u002Fdiv>\n<\u002Fdiv>\n<p aria-hidden=\"true\" style=\"font:600 12px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;margin:9px 0 0\">How well the AI must perform before anyone would use it →<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Ffigure>\n<\u002Fdiv>\n\n<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:18px 20px\">\n<div style=\"display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px\">\n<button type=\"button\" sc-camel-on-click=\"{{ jump3 }}\" style=\"font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--accent);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:5px 9px;cursor:pointer;flex:none\">{{ t3 }}<\u002Fbutton>\n<h3 style=\"font:600 17px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;flex:1 1 240px\">At 85%<\u002Fh3>\n<\u002Fdiv>\n<p style=\"margin:0\">85% right is one wrong answer in seven, and whether that is fine depends entirely on who receives the seventh one. The question to ask of any candidate is <b>when it is wrong, what happens, and to whom.<\u002Fb>&nbsp;<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:18px 20px\">\n<div style=\"display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px\">\n<button type=\"button\" sc-camel-on-click=\"{{ jump4 }}\" style=\"font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--accent);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:5px 9px;cursor:pointer;flex:none\">{{ t4 }}<\u002Fbutton>\n<h3 style=\"font:600 17px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;flex:1 1 240px\">Probably better, probably not<\u002Fh3>\n<\u002Fdiv>\n<p style=\"margin:0 0 .9em\">The PAIR Guidebook gives 8 situations where AI is probably better than a rule: the answer is different for every person (recommending different content, personalization); the answer has not happened yet (prediction of future events); the answer changes over time (low-occurrence events that change, dynamic content over a predictable interface); or the class of things is too large to write down (natural language understanding, recognition of an entire class of entities, an agent for a domain).&nbsp;<\u002Fp>\n<p style=\"margin:0 0 .9em\">The Guidebook also gives 6 situations where AI probably is not better. Once AI belongs, the next decision is whether it should automate the task or augment the person: automate what is “boring, repetitive, awkward, or dangerous,” augment what people want to stay in charge of. To tell them apart for a task you do not do yourself, ask the person who does what they would hand a human assistant.&nbsp;<\u002Fp>\n<div style=\"background:var(--surface-2);border-left:3px solid var(--brand);border-radius:0 6px 6px 0;padding:10px 13px;font-size:14.5px;line-height:1.6\">\n<p style=\"margin:0\"><b>Automate / augment.<\u002Fb> Automate what people are happy to hand off entirely. Augment what they want to stay in charge of, which the Guidebook describes as giving people “superpowers” rather than taking the task away.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin:0 0 34px\">\n<div style=\"display:flex;gap:var(--space-4);align-items:center;margin:0 0 var(--space-5);font-family:var(--font)\"><span style=\"width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:12px/1 var(--mono);font-weight:var(--weight-bold);flex:none\">5<\u002Fspan><h2 style=\"font-size:var(--text-section);margin:0;line-height:var(--leading-tight);color:var(--ink)\">Try it<\u002Fh2><\u002Fdiv>\n<p style=\"font-size:15.5px;font-weight:600;margin:0 0 10px\">Six things a campus might build<\u002Fp>\n<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:var(--pad-card);font-family:var(--font);color:var(--ink);font-size:var(--text-base);line-height:var(--leading-body)\">\n<p style=\"margin:0 0 12px;color:var(--ink-soft);font-size:14.5px\">For each one, say how much expertise the task takes and how well the AI has to perform before anyone would use it. There is no single correct pair for any of them; what matters is that you can say which axis you moved it along and why.<br><\u002Fp>\n<div style=\"display:grid;gap:9px\">\n<div style=\"border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:12px 14px\">\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.5\">A campus map that estimates how long it takes to walk between two buildings.<\u002Fp>\n<div style=\"display:flex;gap:18px;flex-wrap:wrap\">\n<div role=\"group\" aria-label=\"How much expertise the task takes, item 1\" style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n<span style=\"font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)\">expertise<\u002Fspan>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel0r0 }}\" sc-camel-on-click=\"{{ fpick0r0 }}\" style=\"{{ fbtn0r0 }}\">a professional<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel0r1 }}\" sc-camel-on-click=\"{{ fpick0r1 }}\" style=\"{{ fbtn0r1 }}\">a typical adult<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel0r2 }}\" sc-camel-on-click=\"{{ fpick0r2 }}\" style=\"{{ fbtn0r2 }}\">a child could<\u002Fbutton>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"How well the AI must perform, item 1\" style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n<span style=\"font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)\">performance<\u002Fspan>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel0c0 }}\" sc-camel-on-click=\"{{ fpick0c0 }}\" style=\"{{ fbtn0c0 }}\">moderate<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed= ;text-transform:uppercase;color:var(--ink-soft)\">performance<\u002Fspan>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel1c0 }}\" sc-camel-on-click=\"{{ fpick1c0 }}\" style=\"{{ fbtn1c0 }}\">moderate<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel1c1 }}\" sc-camel-on-click=\"{{ fpick1c1 }}\" style=\"{{ fbtn1c1 }}\">good<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel1c2 }}\" sc-camel-on-click=\"{{ fpick1c2 }}\" style=\"{{ fbtn1c2 }}\">excellent<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<span style=\"{{ frameRevShow }}\">\n<div style=\"margin-top:9px;font-size:13.5px;color:var(--ink-soft);line-height:1.55\">Picking related reading is a librarian’s skill, but you are perfectly able to ignore a bad suggestion, so a wrong one costs you a glance. This is a recommender, and the Guidebook’s first “probably better” item is exactly this: different content for different people.<\u002Fdiv>\n<\u002Fspan>\n<\u002Fdiv>\n<div style=\"border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:12px 14px\">\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.5\">A tool that drafts the first version of a routine registrar reply, for a staff member to edit before sending.<\u002Fp>\n<div style=\"display:flex;gap:18px;flex-wrap:wrap\">\n<div role=\"group\" aria-label=\"How much expertise the task takes, item 3\" style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n<span style=\"font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)\">expertise<\u002Fspan>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel2r0 }}\" sc-camel-on-click=\"{{ fpick2r0 }}\" style=\"{{ fbtn2r0 }}\">a professional<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel2r1 }}\" sc-camel-on-click=\"{{ fpick2r1 }}\" style=\"{{ fbtn2r1 }}\">a ty
