ace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)\">expertise<\u002Fspan>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel3r0 }}\" sc-camel-on-click=\"{{ fpick3r0 }}\" style=\"{{ fbtn3r0 }}\">a professional<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel3r1 }}\" sc-camel-on-click=\"{{ fpick3r1 }}\" style=\"{{ fbtn3r1 }}\">a typical adult<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel3r2 }}\" sc-camel-on-click=\"{{ fpick3r2 }}\" style=\"{{ fbtn3r2 }}\">a child could<\u002Fbutton>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"How well the AI must perform, item 4\" style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n<span style=\"font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)\">performance<\u002Fspan>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel3c0 }}\" sc-camel-on-click=\"{{ fpick3c0 }}\" style=\"{{ fbtn3c0 }}\">moderate<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel3c1 }}\" sc-camel-on-click=\"{{ fpick3c1 }}\" style=\"{{ fbtn3c1 }}\">good<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel3c2 }}\" sc-camel-on-click=\"{{ fpick3c2 }}\" style=\"{{ fbtn3c2 }}\">excellent<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<span style=\"{{ frameRevShow }}\">\n<div style=\"margin-top:9px;font-size:13.5px;color:var(--ink-soft);line-height:1.55\">Reading four characters off a plate is not expert work, and the system still has to be near-perfect, because the wrong plate is somebody else’s ticket and they have to prove it was not them. This is the face-unlock shape: an easy task on the right-hand side of the grid.<\u002Fdiv>\n<\u002Fspan>\n<\u002Fdiv>\n<div style=\"border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:12px 14px\">\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.5\">A system that flags which financial-aid applications need a human reviewer.<\u002Fp>\n<div style=\"display:flex;gap:18px;flex-wrap:wrap\">\n<div role=\"group\" aria-label=\"How much expertise the task takes, item 5\" style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n<span style=\"font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)\">expertise<\u002Fspan>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel4r0 }}\" sc-camel-on-click=\"{{ fpick4r0 }}\" style=\"{{ fbtn4r0 }}\">a professional<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel4r1 }}\" sc-camel-on-click=\"{{ fpick4r1 }}\" style=\"{{ fbtn4r1 }}\">a typical adult<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel4r2 }}\" sc-camel-on-click=\"{{ fpick4r2 }}\" style=\"{{ fbtn4r2 }}\">a child could<\u002Fbutton>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"How well the AI must perform, item 5\" style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n<span style=\"font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)\">performance<\u002Fspan>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel4c0 }}\" sc-camel-on-click=\"{{ fpick4c0 }}\" style=\"{{ fbtn4c0 }}\">moderate<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel4c1 }}\" sc-camel-on-click=\"{{ fpick4c1 }}\" style=\"{{ fbtn4c1 }}\">good<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel4c2 }}\" sc-camel-on-click=\"{{ fpick4c2 }}\" style=\"{{ fbtn4c2 }}\">excellent<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<span style=\"{{ frameRevShow }}\">\n<div style=\"margin-top:9px;font-size:13.5px;color:var(--ink-soft);line-height:1.55\">Aid rules are professional work, and the flag is not the decision, so it does not need to be excellent. But it cannot be moderate either: one missed application in seven is a student who does not get aid, and nobody downstream is looking for what the system did not flag. <b>Missing something is worse than flagging it wrongly here<\u002Fb>, which is a distinction Week 6 will give you the words for.<\u002Fdiv>\n<\u002Fspan>\n<\u002Fdiv>\n<div style=\"border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:12px 14px\">\n<p style=\"margin:0 0 10px;font-size:15px;line-height:1.5\">A proctoring system that decides whether a student cheated during an exam.<\u002Fp>\n<div style=\"display:flex;gap:18px;flex-wrap:wrap\">\n<div role=\"group\" aria-label=\"How much expertise the task takes, item 6\" style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n<span style=\"font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)\">expertise<\u002Fspan>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel5r0 }}\" sc-camel-on-click=\"{{ fpick5r0 }}\" style=\"{{ fbtn5r0 }}\">a professional<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel5r1 }}\" sc-camel-on-click=\"{{ fpick5r1 }}\" style=\"{{ fbtn5r1 }}\">a typical adult<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel5r2 }}\" sc-camel-on-click=\"{{ fpick5r2 }}\" style=\"{{ fbtn5r2 }}\">a child could<\u002Fbutton>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"How well the AI must perform, item 6\" style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n<span style=\"font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)\">performance<\u002Fspan>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel5c0 }}\" sc-camel-on-click=\"{{ fpick5c0 }}\" style=\"{{ fbtn5c0 }}\">moderate<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel5c1 }}\" sc-camel-on-click=\"{{ fpick5c1 }}\" style=\"{{ fbtn5c1 }}\">good<\u002Fbutton>\n<button type=\"button\" disabled=\"{{ frameRev }}\" aria-pressed=\"{{ fsel5c2 }}\" sc-camel-on-click=\"{{ fpick5c2 }}\" style=\"{{ fbtn5c2 }}\">excellent<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<span style=\"{{ frameRevShow }}\">\n<div style=\"margin-top:9px;font-size:13.5px;color:var(--ink-soft);line-height:1.55\"><span style=\"font:700 10px/1 var(--font);text-transform:uppercase;letter-spacing:.08em;color:var(--warn);background:var(--warn-bg);border-radius:99px;padding:3px 8px;margin-right:7px;vertical-align:1px\">arguable<\u002Fspan>Top-right on the grid, and that is not the end of the argument. Even at excellent, one accusation in a hundred is a student in an academic-integrity hearing over nothing, and the person who has to prove a negative is the student. One reading: this belongs top-right and needs to be near-perfect. The other: the grid is the wrong tool, because this is the Guidebook’s “minimizing costly errors” case and the answer is not a better model but a person deciding. <b>Both are defensible; what is not defensible is placing it without saying what happens to the student who is wrongly flagged.<\u002Fb><\u002Fdiv>\n<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap\">\n<span style=\"{{ frameOpenShow }}\">\n<button type=\"button\" disabled=\"{{ frameShort }}\" sc-camel-on-click=\"{{ frameReveal }}\" style=\"display:inline-block;border:0;cursor:pointer;text-decoration:none;font-family:var(--font);font-weight:var(--weight-medium);border-radius:var(--radius-btn);transition:var(--transition-hover);line-height:1.2;padding:6px 13px;font-size:var(--text-note);background:var(--action-primary);color:#fff\">Show the reasons<\u002Fbutton>\n<\u002Fspan>\n<span style=\"{{ frameStartOverShow }}\">\n<button type=\"button\" sc-camel-on-click=\"{{ frameReset }}\" style=\"display:inline-block;border:0;cursor:pointer;text-decoration:none;font-family:var(--font);font-weight:var(--weight-medium);border-radius:var(--radius-btn);transition:var(--transition-hover);line-height:1.2;padding:6px 13px;font-size:var(--text-note);background:var(--surface);color:var(--brand);box-shadow:inset 0 0 0 1px var(--line)\">Start over<\u002Fbutton>\n<\u002Fspan>\n<span style=\"font-size:13px;color:var(--ink-soft)\">Ungraded, not submitted, saved in this browser only. Nothing here is scored — one of the six has no correct pair.<\u002Fspan>\n<\u002Fdiv>\n<span style=\"{{ frameRevShow }}\">\n<p style=\"margin:12px 0 0;font-size:14.5px;line-height:1.65\">Three of these six sit in the moderate column, which is the paper’s actual finding. If you put your own candidate on the right, check whether that is the task or the habit the paper warns about.<\u002Fp>\n<\u002Fspan>\n<\u002Fdiv>\n\n<span style=\"{{ showAugmentBoxShow }}\">\n<div style=\"height:12px\"><\u002Fdiv>\n<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:var(--pad-card);font-family:var(--font);color:var(--ink);font-size:var(--text-base);line-height:var(--leading-body)\">\n<p style=\"margin:0 0 4px;font-size:15.5px;font-weight:600\">Automate or augment, and the fact that would flip it<\u002Fp>\n<p style=\"margin:0 0 14px;font-size:14.5px;color:var(--ink-soft);line-height:1.6\">Pick one task inside your candidate. Nothing is submitted from here — the graded version is <b>Project Topic Lock Part A(5)<\u002Fb>, and you can paste this into it.<\u002Fp>\n<div sc-camel-on-change=\"{{ boxEdit }}\" style=\"display:grid;gap:14px\">\n<fieldset style=\"border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin:0\">\n<legend style=\"font-size:14.5px;font-weight:600;padding:0 6px\">For that task, should the AI automate or augment?<\u002Flegend>\n<div style=\"display:flex;gap:18px;flex-wrap:wrap\">\n<label style=\"display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer\"><input type=\"radio\" name=\"w05l2-aa\" data-aa=\"automate\" checked=\"{{ aaAutomate }}\" style=\"accent-color:#2E5643\">Automate it<\u002Flabel>\n<label style=\"display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer\"><input type=\"radio\" name=\"w05l2-aa\" data-aa=\"augment\" checked=\"{{ aaAugment }}\" style=\"accent-color:#2E5643\">Augment the person<\u002Flabel>\n<\u002Fdiv>\n<p style=\"margin:10px 0 0;font-size:13.5px;color:var(--ink-soft);line-height:1.55\">Automate what is boring, repetitive, awkward or dangerous. Augment what the person wants to stay in charge of.<\u002Fp>\n<\u002Ffieldset>\n<label style=\"display:grid;gap:6px\">\n<span style=\"font-size:14.5px;font-weight:600\">The one fact that would flip it <span style=\"font-weight:400;color:var(--ink-soft)\">— something you could actually go and find out<\u002Fspan><\u002Fspan>\n<textarea data-f=\"flip\" rows=\"2\" value=\"{{ flipText }}\" placeholder=\"If it turned out that…\" style=\"font:15px/1.6 var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;resize:vertical;width:100%\"><\u002Ftextarea>\n<\u002Flabel>\n<\u002Fdiv>\n<p style=\"margin:14px 0 0;font-size:13px;color:var(--ink-soft)\">Ungraded, not submitted, saved in this browser only.<\u002Fp>\n<\u002Fdiv>\n<\u002Fspan>\n\n<div style=\"height:14px\"><\u002Fdiv>\n\n\n<\u002Fsection>\n\n<section style=\"margin:0 0 34px\">\n<div style=\"display:flex;gap:var(--space-4);align-items:center;margin:0 0 var(--space-5);font-family:var(--font)\"><span style=\"width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:12px/1 var(--mono);font-weight:var(--weight-bold);flex:none\">6<\u002Fspan><h2 style=\"font-size:var(--text-section);margin:0;line-height:var(--leading-tight);color:var(--ink)\">Check yourself<\u002Fh2><\u002Fdiv>\n<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:var(--pad-card);font-family:var(--font);color:var(--ink);font-size:var(--text-base);line-height:var(--leading-body)\">\n<div>\n<p style=\"font-weight:600;margin:0 0 10px\">Two campus tools both run at 88% accuracy: a walking-time estimator and the plate reader that issues parking tickets. By the paper’s bins, 88% is “moderate” for both. What decides whether 88% is good enough?<\u002Fp>\n<div role=\"radio\" aria-checked=\"{{ qsel0 }}\" sc-camel-tab-index=\"0\" sc-camel-on-click=\"{{ qpick0 }}\" sc-camel-on-key-down=\"{{ qkey0 }}\" style=\"{{ qo0 }}\">\n<span style=\"{{ qm0Show }}\"><span style=\"{{ qms0 }}\">{{ qm0 }}<\u002Fspan><\u002Fspan>\n<span>Which one has more users.<\u002Fspan>\n<span style=\"{{ quizRevShow }}\"><span style=\"display:block;font-size:var(--text-note);color:var(--ink-soft);margin-top:5px;line-height:var(--leading-note)\">Scale changes how many people are affected, not whether the error is tolerable. A walking-time estimate used by twenty thousand students is still a walking-time estimate; a plate reader used by twelve people still issues real tickets to the wrong ones.<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div role=\"radio\" aria-checked=\"{{ qsel1 }}\" sc-camel-tab-index=\"0\" sc-camel-on-click=\"{{ qpick1 }}\" sc-camel-on-key-down=\"{{ qkey1 }}\" style=\"{{ qo1 }}\">\n<span style=\"{{ qm1Show }}\"><span style=\"{{ qms1 }}\">{{ qm1 }}<\u002Fspan><\u002Fspan>\n<span>Which one was harder to build.<\u002Fspan>\n<span style=\"{{ quizRevShow }}\"><span style=\"display:block;font-size:var(--text-note);color:var(--ink-soft);margin-top:5px;line-height:var(--leading-note)\">This is the reflex the paper is arguing against. Difficulty is about you; the question is about the person on the other end. Some of the most useful AI in the world is easy to build and sits in a forgiving slot, which is the whole finding.<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div role=\"radio\" aria-checked=\"{{ qsel2 }}\" sc-camel-tab-index=\"0\" sc-camel-on-click=\"{{ qpick2 }}\" sc-camel-on-key-down=\"{{ qkey2 }}\" style=\"{{ qo2 }}\">\n<span style=\"{{ qm2Show }}\"><span style=\"{{ qms2 }}\">{{ qm2 }}<\u002Fspan><\u002Fspan>\n<span>What happens to the person who gets the wrong answer.<\u002Fspan>\n<span style=\"{{ quizRevShow }}\"><span style=\"display:block;font-size:var(--text-note);color:var(--ink-soft);margin-top:5px;line-height:var(--leading-note)\">Yes, and it is the lesson’s one claim. One wrong walking time in seven and you leave two minutes late. One wrong plate in seven and somebody is disputing a ticket they did not earn, with the burden on them. Identical accuracy, and only one of them can ship at 88%.<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div role=\"radio\" aria-checked=\"{{ qsel3 }}\" sc-camel-tab-index=\"0\" sc-camel-on-click=\"{{ qpick3 }}\" sc-camel-on-key-down=\"{{ qkey3 }}\" style=\"{{ qo3 }}\">\n<span style=\"{{ qm3Show }}\"><span style=\"{{ qms3 }}\">{{ qm3 }}<\u002Fspan><\u002Fspan>\n<span>Whether 88% counts as moderate or good.<\u002Fspan>\n<span style=\"{{ quizRevShow }}\"><span style=\"display:block;font-size:var(--text-note);color:var(--ink-soft);margin-top:5px;line-height:var(--leading-note)\">The bins are a shared vocabulary, not a verdict. Moving 88% into a different bin would not change what happens to the person holding the wrong ticket, and that is the thing the decision actually turns on.<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap\">\n<span style=\"{{ quizOpenShow }}\">\n<button type=\"button\" disabled=\"{{ quizNoPick }}\" sc-camel-on-click=\"{{ quizCheck }}\" style=\"display:inline-block;border:0;cursor:pointer;text-decoration:none;font-family:var(--font);font-weight:var(--weight-medium);border-radius:var(--radius-btn);transition:var(--transition-hover);line-height:1.2;padding:6px 13px;font-size:var(--text-note);background:var(--action-primary);color:#fff\">Check<\u002Fbutton>\n<\u002Fspan>\n<span style=\"{{ quizRevShow }}\">\n<button type=\"button\" sc-camel-on-click=\"{{ quizAgain }}\" style=\"display:inline-block;border:0;cursor:pointer;text-decoration:none;font-family:var(--font);font-weight:var(--weight-medium);border-radius:var(--radius-btn);transition:var(--transition-hover);line-height:1.2;padding:6px 13px;font-size:var(--text-note);background:var(--surface);color:var(--brand);box-shadow:inset 0 0 0 1px var(--line)\">Try again<\u002Fbutton>\n<\u002Fspan>\n<span style=\"font-size:13px;color:var(--ink-soft)\">Not graded and not recorded. The reason under each option is the point, not the score.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin:0 0 34px\">\n<div style=\"display:flex;gap:var(--space-4);align-items:center;margin:0 0 var(--space-5);font-family:var(--font)\"><span style=\"width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:12px/1 var(--mono);font-weight:var(--weight-bold);flex:none\">7<\u002Fspan><h2 style=\"font-size:var(--text-section);margin:0;line-height:var(--leading-tight);color:var(--ink)\">Key takeaways<\u002Fh2><\u002Fdiv>\n<ul style=\"list-style:none;margin:0;padding:0;display:grid;gap:9px\">\n<li style=\"background:var(--surface);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 15px;font-size:15.5px;line-height:1.65\">\n<p style=\"margin:0\"><b style=\"color: var(--brand-ink);\">Most useful AI is only moderately good.<\u002Fb>&nbsp;25 of the paper's 40 real products sit below 90% accuracy and are worth having anyway, which is the paper's own headline finding and the reason to stop looking for near-perfect ideas.<\u002Fp>\n<\u002Fli>\n\n<li style=\"background:var(--surface);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 15px;font-size:15.5px;line-height:1.65\">\n<p style=\"margin:0\"><b style=\"color:var(--brand-ink)\">The 85% question is the harm question.<\u002Fb> Not “will it be wrong,” which Week 2 settled, but when it is wrong, what happens, and to whom. A barista and a pharmacist with the same error rate are not in the same business.<\u002Fp>\n<\u002Fli>\n<li style=\"background:var(--surface);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 15px;font-size:15.5px;line-height:1.65\">\n<p style=\"margin:0\"><b style=\"color:var(--brand-ink)\">Moderate is a property of the slot, never permission.<\u002Fb> It says you can afford to start there. It never says you can stop caring, and it never means build it carelessly.<\u002Fp>\n<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<section style=\"margin:0 0 34px\">\n<div style=\"display:flex;gap:var(--space-4);align-items:center;margin:0 0 var(--space-5);font-family:var(--font)\"><span style=\"width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:12px/1 var(--mono);font-weight:var(--weight-bold);flex:none\">8<\u002Fspan><h2 style=\"font-size:var(--text-section);margin:0;line-height:var(--leading-tight);color:var(--ink)\">Watch out for<\u002Fh2><\u002Fdiv>\n<div style=\"display:grid;gap:12px\">\n<div style=\"background:var(--warn-bg);border-left:4px solid var(--warn);border-radius:0 8px 8px 0;padding:12px 15px;font-family:var(--font);font-size:var(--text-ui);line-height:var(--leading-body)\">\n<p style=\"margin:0\"><b>Reading “85% is enough” as “so we don't have to be careful.”<\u002Fb> The dining-hall estimate is useful at 85% because of where it sits: an easy task, a cheap mistake, nobody doing it otherwise. That is a fact about the slot, not a licence. Pick the slot honestly, then build the best thing you can for it.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background:var(--warn-bg);border-left:4px solid var(--warn);border-radius:0 8px 8px 0;padding:12px 15px;font-family:var(--font);font-size:var(--text-ui);line-height:var(--leading-body)\">\n<p style=\"margin:0\"><b>Treating the three bins as a verdict.<\u002Fb> They are a shared vocabulary for talking about a minimum, and the minimum comes from the person, not the model. Two systems at the same accuracy can need different bins because different people are downstream.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin:0 0 34px\">\n<div style=\"display:flex;gap:var(--space-4);align-items:center;margin:0 0 var(--space-5);font-family:var(--font)\"><span style=\"width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:12px/1 var(--mono);font-weight:var(--weight-bold);flex:none\">9<\u002Fspan><h2 style=\"font-size:var(--text-section);margin:0;line-height:var(--leading-tight);color:var(--ink)\">Before you move on<\u002Fh2><\u002Fdiv>\n<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:var(--pad-card);font-family:var(--font);color:var(--ink);font-size:var(--text-base);line-height:var(--leading-body)\">\n<div sc-camel-on-change=\"{{ ckToggle }}\">\n<label style=\"display:flex;gap:11px;align-items:baseline;padding:10px 0;cursor:pointer\">\n<input type=\"checkbox\" data-ck=\"0\" checked=\"{{ ck.c0 }}\" style=\"width:17px;height:17px;accent-color:#2E5643;flex:none;transform:translateY(2px)\">\n<span style=\"font-size:15px\">Watched <b>How well it has to work<\u002Fb> <span style=\"font:11px ui-monospace,Menlo,Consolas,monospace;color:#8A7F6E\">≈22 min<\u002Fspan><\u002Fspan>\n<\u002Flabel>\n\n<label style=\"display:flex;gap:11px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);cursor:pointer\">\n<input type=\"checkbox\" data-ck=\"2\" checked=\"{{ ck.c2 }}\" style=\"width:17px;height:17px;accent-color:#2E5643;flex:none;transform:translateY(2px)\">\n<span style=\"font-size:15px\">I can put my own capability line on the grid and say which axis I am least sure about <span style=\"font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:#5C5850;background:#EFEBE3;border-radius:99px;padding:3px 8px;white-space:nowrap\">objective 1<\u002Fspan><\u002Fspan>\n<\u002Flabel>\n<label style=\"display:flex;gap:11px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);cursor:pointer\">\n<input type=\"checkbox\" data-ck=\"3\" checked=\"{{ ck.c3 }}\" style=\"width:17px;height:17px;accent-color:#2E5643;flex:none;transform:translateY(2px)\">\n<span style=\"font-size:15px\">I can name <b>one person<\u002Fb> who gets the seventh answer when my candidate is wrong, and say what it costs them <span style=\"font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:#5C5850;background:#EFEBE3;border-radius:99px;padding:3px 8px;white-space:nowrap\">objective 2<\u002Fspan><\u002Fspan>\n<\u002Flabel>\n<label style=\"display:flex;gap:11px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);cursor:pointer\">\n<input type=\"checkbox\" data-ck=\"4\" checked=\"{{ ck.c4 }}\" style=\"width:17px;height:17px;accent-color:#2E5643;flex:none;transform:translateY(2px)\">\n<span style=\"font-size:15px\">I have checked my candidate against the Guidebook's “probably not better” list&nbsp;<span style=\"font: 600 10px / 1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: rgb(92, 88, 80); background: rgb(239, 235, 227); border-radius: 99px; padding: 3px 8px; white-space: nowrap;\">objective 2<\u002Fspan><\u002Fspan>\n<\u002Flabel>\n<label style=\"display:flex;gap:11px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);cursor:pointer\">\n<input type=\"checkbox\" data-ck=\"5\" checked=\"{{ ck.c5 }}\" style=\"width:17px;height:17px;accent-color:#2E5643;flex:none;transform:translateY(2px)\">\n<span style=\"font-size:15px\">I can say automate or augment for one task in my candidate, <b>and name the one fact that would flip it<\u002Fb> <span style=\"font:600 10px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:#5C5850;background:#EFEBE3;border-radius:99px;padding:3px 8px;white-space:nowrap\">objective 3<\u002Fspan><\u002Fspan>\n<\u002Flabel>\n\n<\u002Fdiv>\n<p style=\"margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.6\">Next: <b>Lesson 3, Asking people about it<\u002Fb>, where the protocol you write is built to test the slot you just chose.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"display:flex;justify-content:space-between;gap:var(--space-5);margin-top:var(--space-10);padding-top:var(--space-7);border-top:1px solid var(--line);font-family:var(--font)\">\n<a href=\"{{ prevHref }}\" style=\"text-decoration:none;font-weight:var(--weight-medium);color:var(--brand);font-size:var(--text-option)\">← Lesson 1 · What AI can do<\u002Fa>\n<a href=\"{{ nextHref }}\" style=\"text-decoration:none;font-weight:var(--weight-medium);color:var(--brand);font-size:var(--text-option)\">Lesson 3 · Asking people about it →<\u002Fa>\n<\u002Fdiv>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;paperUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://dl.acm.org/doi/epdf/10.1145/3563657.3596058&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;,&quot;label&quot;:&quot;Yildirim et al. (2023) PDF&quot;},&quot;pairUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://pair.withgoogle.com/chapter/user-needs/&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;,&quot;label&quot;:&quot;People + AI Guidebook · User Needs&quot;},&quot;rrUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;,&quot;label&quot;:&quot;Reading Response #4 in Canvas (blank = link pending)&quot;},&quot;requireAllPlaced&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Try it&quot;,&quot;label&quot;:&quot;Require all six placed before the reasons open&quot;},&quot;showAugmentBox&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Try it&quot;,&quot;label&quot;:&quot;Automate-or-augment text box (Pass A's original treatment)&quot;}}\">\nclass Component extends DCLogic {\n  /* Same store shape every W03/W04/W05 lesson uses: ck2 + ckTotal under\n     isda180:w05-lesson-2, which the sidebar reads for the done mark and the week\n     bar. Renaming that key erases student ticks. The frame exercise and the quiz\n     write into the same key through interactive.jsx's own store helper. */\n  SK = 'w05-lesson-2';\n  CK_TOTAL = 7;\n  /* Answer key for the quiz (index 2) and the frame exercise. All the prose — the\n     question, the option labels and reasons, the six item labels and their reasons —\n     is template markup so it stays editable in place; only keys and state live here.\n     FRAME rows: 0 a professional · 1 a typical adult · 2 a child could.\n     FRAME cols: 0 moderate · 1 good · 2 excellent. Item 6 (proctoring) has no\n     reference pair: it is arguable by construction. */\n  QUIZ_CORRECT = 2;\n  QUIZ_N = 4;\n  FRAME = [{ r: 2, c: 0 }, { r: 1, c: 0 }, { r: 1, c: 0 }, { r: 2, c: 2 }, { r: 0, c: 1 }, {}];\n  state = { ck: {}, aa: '', flip: '', quizA: null, quizRev: false, fpicks: {}, frameRev: false };\n  componentDidMount() {\n    this.pvMount();\n    const st = this.readStore();\n    const bx = st.boxes || {};\n    const fr = st.frame || {};\n    this.setState({\n      ck: st.ck2 || {}, aa: bx.aa || '', flip: bx.flip || '',\n      quizA: (st.quiz || {}).a === undefined ? null : (st.quiz || {}).a,\n      quizRev: !!(st.quiz || {}).rev,\n      fpicks: fr.picks || {}, frameRev: !!fr.rev\n    });\n    this.writeStore({ ckTotal: this.CK_TOTAL });\n  }\n  readStore() {\n    try { return JSON.parse(localStorage.getItem('isda180:' + this.SK)) || {}; } catch (e) { return {}; }\n  }\n  writeStore(patch) {\n    const next = { ...this.readStore(), ...patch };\n    try { localStorage.setItem('isda180:' + this.SK, JSON.stringify(next)); } catch (e) {}\n    try { window.dispatchEvent(new CustomEvent('isda180:state', { detail: { key: this.SK } })); } catch (e) {}\n  }\n  pickQuiz(i) {\n    if (this.state.quizRev) return;\n    this.setState({ quizA: i });\n    this.writeStore({ quiz: { a: i, rev: false } });\n  }\n  quizVals() {\n    const a = this.state.quizA, rev = !!this.state.quizRev, C = this.QUIZ_CORRECT;\n    const out = {\n      quizRev: rev, quizOpen: !rev, quizNoPick: a === null || a === undefined,\n      quizCheck: () => { if (a === null || a === undefined) return; this.setState({ quizRev: true }); this.writeStore({ quiz: { a, rev: true } }); },\n      quizAgain: () => { this.setState({ quizA: null, quizRev: false }); this.writeStore({ quiz: { a: null, rev: false } }); }\n    };\n    for (let i = 0; i < this.QUIZ_N; i++) {\n      const sel = a === i, right = i === C, missed = rev && right && !sel;\n      const tone = !rev\n        ? { b: sel ? 'var(--ink-soft)' : 'var(--line)', bg: sel ? 'var(--surface-2)' : 'var(--surface)', s: 'solid' }\n        : right ? { b: 'var(--ok)', bg: 'var(--ok-bg)', s: missed ? 'dashed' : 'solid' }\n          : sel ? { b: 'var(--no)', bg: 'var(--no-bg)', s: 'solid' }\n            : { b: 'var(--line)', bg: 'var(--surface)', s: 'solid' };\n      out['qo' + i] = {\n        border: '1.5px ' + tone.s + ' ' + tone.b, background: tone.bg, borderRadius: 9,\n        padding: '9px 13px', margin: '0 0 7px', fontSize: 'var(--text-option)',\n        fontFamily: 'var(--font)', cursor: rev ? 'default' : 'pointer',\n        transition: 'var(--transition-hover)'\n      };\n      out['qm' + i] = rev ? (right ? (missed ? 'Missed — correct' : 'Correct') : (sel ? 'Incorrect' : '')) : '';\n      out['qms' + i] = {\n        fontSize: 'var(--text-clo)', textTransform: 'uppercase', letterSpacing: '.08em',\n        fontWeight: 'var(--weight-bold)', color: right ? 'var(--ok)' : 'var(--no)',\n        display: 'block', marginBottom: 3\n      };\n      out['qsel' + i] = !!sel;\n      out['qpick' + i] = () => this.pickQuiz(i);\n      out['qkey' + i] = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.pickQuiz(i); } };\n    }\n    return out;\n  }\n  pickFrame(i, kind, j) {\n    if (this.state.frameRev) return;\n    const picks = { ...this.state.fpicks, [i + kind]: j };\n    this.setState({ fpicks: picks });\n    this.writeStore({ frame: { picks, rev: false } });\n  }\n  frameVals() {\n    const picks = this.state.fpicks || {}, rev = !!this.state.frameRev;\n    const placed = this.FRAME.filter((_, i) => picks[i + 'r'] !== undefined && picks[i + 'c'] !== undefined).length;\n    const short = (this.props.requireAllPlaced ?? true) && placed < this.FRAME.length;\n    const out = {\n      frameRev: rev, frameOpen: !rev, frameShort: short,\n      frameStartOver: rev || placed > 0 || Object.keys(picks).length > 0,\n      frameReveal: () => {\n        if (short) return;\n        this.setState({ frameRev: true });\n        this.writeStore({ frame: { picks: this.state.fpicks, rev: true } });\n      },\n      frameReset: () => {\n        this.setState({ fpicks: {}, frameRev: false });\n        this.writeStore({ frame: { picks: {}, rev: false } });\n      }\n    };\n    this.FRAME.forEach((ref, i) => {\n      ['r', 'c'].forEach((kind) => {\n        for (let j = 0; j < 3; j++) {\n          const sel = picks[i + kind] === j;\n          const lands = rev && ref[kind] !== undefined && ref[kind] === j;\n          out['fsel' + i + kind + j] = !!sel;\n          out['fbtn' + i + kind + j] = {\n            font: '600 13px/1.2 var(--font)', padding: '7px 12px', borderRadius: 8,\n            cursor: rev ? 'default' : 'pointer', transition: 'var(--transition-hover)',\n            border: '1.5px ' + (lands ? 'dashed var(--brand)' : 'solid ' + (sel ? 'var(--ink-soft)' : 'var(--line)')),\n            background: sel ? 'var(--surface-2)' : 'var(--surface)',\n            color: lands ? 'var(--brand)' : 'var(--ink)'\n          };\n          out['fpick' + i + kind + j] = () => this.pickFrame(i, kind, j);\n        }\n      });\n    });\n    return out;\n  }\n  /* The rail is page-local markup now, so every label in it is editable. Only the\n     live parts come from here: which lessons are ticked (same store the lesson\n     pages write), the duration metas from the manifest, and the week jump. */\n  railVals() {\n    const H = (h) => (window.ISDA_HREF ? window.ISDA_HREF(h) : h);\n    const ids = ['w05-lesson-1', 'w05-lesson-2', 'w05-lesson-3'];\n    const hrefs = ['W05 Lesson 1.dc.html', 'W05 Lesson 2.dc.html', 'W05 Lesson 3.dc.html'];\n    const vids = ['w05-seg1', 'w05-seg2', 'w05-seg3'];\n    const out = { ovHref: H('Week 5 Overview.dc.html'), weekId: 'w05' };\n    let done = 0;\n    ids.forEach((id, i) => {\n      let d = false, meta = '';\n      try {\n        const s = JSON.parse(localStorage.getItem('isda180:' + id)) || {};\n        const total = s.ckTotal || 0;\n        const ticked = Object.values(s.ck2 || {}).filter(Boolean).length;\n        d = !!s.done || (total > 0 && ticked >= total);\n      } catch (e) {}\n      try {\n        const m = (window.ISDA_MANIFESTS || {})['w05'] || {};\n        const v = (m.videos || []).find(x => x.id === vids[i]);\n        if (v && v.duration) meta = 'video ' + v.duration;\n      } catch (e) {}\n      if (d) done++;\n      out['rl' + i + 'Href'] = H(hrefs[i]);\n      out['rl' + i + 'Done'] = d;\n      out['rl' + i + 'Meta'] = meta;\n    });\n    out.progFill = {\n      height: '100%', width: Math.round(done / ids.length * 100) + '%',\n      background: 'var(--accent)', borderRadius: 99, transition: 'width 240ms cubic-bezier(.2,0,0,1)'\n    };\n    out.onWeek = (e) => {\n      const map = { w01: 'Week 1 Overview.dc.html', w02: 'Week 2 Overview.dc.html', w03: 'Week 3 Overview.dc.html', w04: 'Week 4 Overview.dc.html', w05: 'Week 5 Overview.dc.html' };\n      const t = map[e.target.value];\n      if (t && e.target.value !== 'w05') location.href = H(t);\n    };\n    return out;\n  }\n  /* Player is page-local markup so its labels are editable. The mechanics stay\n     here: the seek bus every timestamp button calls, and the corner dock that\n     follows you down the page without reloading the embed (src only changes on a\n     real jump, which is how Panopto seeks). */\n  PV_ID = 'w05-seg2';\n  pvVideo() {\n    try {\n      const m = (window.ISDA_MANIFESTS || {})['w05'] || {};\n      return (m.videos || []).find(x => x.id === this.PV_ID) || null;\n    } catch (e) { return null; }\n  }\n  pvMount() {\n    let n = 0;\n    window.__seek = (t, label) => {\n      const s = String(t || '0').split(':').map(Number);\n      const secs = s.length === 3 ? s[0] * 3600 + s[1] * 60 + s[2] : s.length === 2 ? s[0] * 60 + s[1] : (s[0] || 0);\n      this.setState({ pvDismissed: false, pvCue: { t, label, s: secs, n: ++n } });\n    };\n    const el = document.getElementById('player');\n    if (el && 'IntersectionObserver' in window) {\n      this._pvIo = new IntersectionObserver(([e]) => {\n        const off = !e.isIntersecting && e.boundingClientRect.bottom < 0;\n        this.setState({ pvOff: off });\n        if (!off) this.setState({ pvDismissed: false });\n      }, { rootMargin: '-56px 0px 0px 0px' });\n      this._pvIo.observe(el);\n    }\n  }\n  componentWillUnmount() {\n    window.__seek = null;\n    if (this._pvIo) this._pvIo.disconnect();\n  }\n  playerVals() {\n    const v = this.pvVideo();\n    const embedId = v && (v.panoptoId || v.embedId);\n    const cue = this.state.pvCue;\n    const docked = !!embedId && !!this.state.pvOff && !this.state.pvDismissed;\n    const dockW = Math.min(384, (typeof window !== 'undefined' ? window.innerWidth : 400) - 32);\n    const base = 'https://sjsu.hosted.panopto.com/Panopto/Pages/Embed.aspx?id=' + embedId +\n      '&offerviewer=true&showtitle=true&showbrand=true&captions=true&interactivity=all';\n    return {\n      pvHasVideo: !!embedId,\n      pvPending: !embedId,\n      pvDocked: docked,\n      pvSrc: embedId ? (cue ? base + '&start=' + cue.s + '&autoplay=true#t=' + cue.s + '-' + cue.n : base + '&autoplay=false') : '',\n      pvCue: cue ? cue.t + (cue.label ? ' · ' + cue.label : '') : '',\n      pvJumped: !!(embedId && cue),\n      pvStay: !!(this.state.pvOff && this.state.pvDismissed),\n      pvBox: docked\n        ? { position: 'fixed', right: 18, bottom: 18, width: dockW, height: Math.round(dockW * 9 / 16), zIndex: 60, boxShadow: '0 10px 34px rgba(0,0,0,.3)', borderRadius: 12, overflow: 'hidden', background: '#14170F' }\n        : { position: 'absolute', inset: 0, borderRadius: 12, overflow: 'hidden', background: '#14170F' },\n      pvBack: () => {\n        const el = document.getElementById('player');\n        if (!el) return;\n        const sc = document.scrollingElement || document.documentElement;\n        sc.scrollTo({ top: Math.max(0, sc.scrollTop + el.getBoundingClientRect().top - 24), behavior: 'smooth' });\n      },\n      pvStop: () => this.setState({ pvDismissed: true })\n    };\n  }\n  renderVals() {\n    const v = this.vals();\n    const out = Object.assign({}, v);\n    Object.keys(v).forEach((k) => {\n      const t = typeof v[k];\n      if (t === 'boolean' || t === 'string' || t === 'number' || v[k] == null) {\n        out[k + 'Show'] = { display: v[k] ? 'contents' : 'none' };\n      }\n    });\n    return out;\n  }\n  vals() {\n    const L = (h) => (window.ISDA_HREF ? window.ISDA_HREF(h) : h);\n    /* Chapter starts come from the manifest, not from this page: the walkthrough copy\n       is editable template markup but the times belong to the video's own record.\n       All four are word-count estimates from planning/weeks/w05/video/seg2.md — after\n       recording, replace them in w05-video-manifest.js and every timestamp here follows. */\n    const wk = (window.ISDA_MANIFESTS || {})['w05'] || {};\n    const vid = (wk.videos || []).find(v => v.id === 'w05-seg2') || {};\n    const chapters = vid.chapters || [];\n    const at = (i) => (chapters[i] || {}).t || '–:––';\n    const seek = (i) => () => window.__seek && window.__seek(at(i), (chapters[i] || {}).title);\n    const rrUrl = (this.props.rrUrl ?? '').trim() || 'https://sjsu.instructure.com/courses/1631879/assignments/7911708';\n    return {\n      ...this.playerVals(),\n      ...this.railVals(),\n      ...this.quizVals(),\n      ...this.frameVals(),\n      rrPending: !rrUrl,\n      paperUrl: this.props.paperUrl ?? 'https://dl.acm.org/doi/epdf/10.1145/3563657.3596058',\n      pairUrl: this.props.pairUrl ?? 'https://pair.withgoogle.com/chapter/user-needs/',\n      rrUrl: rrUrl || '#',\n      hasRrLink: !!rrUrl,\n      t1: at(0), t2: at(1), t3: at(2), t4: at(3),\n      jump1: seek(0), jump2: seek(1), jump3: seek(2), jump4: seek(3),\n      /* Off by default. Pass A asked for one text box here (automate or augment, plus the\n         fact that would flip it) and no live page in this course carries free text. Turn\n         this on and objective 3 gets page practice instead of only the Canvas Lock —\n         the instructor note says this is the one text box worth building this week. */\n      showAugmentBox: this.props.showAugmentBox ?? false,\n      aaAutomate: this.state.aa === 'automate',\n      aaAugment: this.state.aa === 'augment',\n      flipText: this.state.flip,\n      boxEdit: (e) => {\n        const t = e.target;\n        let next = null;\n        if (t.hasAttribute('data-f')) next = { [t.getAttribute('data-f')]: t.value };\n        else if (t.hasAttribute('data-aa')) next = { aa: t.getAttribute('data-aa') };\n        if (!next) return;\n        this.setState(next);\n        this.writeStore({ boxes: { aa: this.state.aa, flip: this.state.flip, ...next } });\n      },\n      ck: { c0: !!this.state.ck.i0, c1: !!this.state.ck.i1, c2: !!this.state.ck.i2, c3: !!this.state.ck.i3,\n        c4: !!this.state.ck.i4, c5: !!this.state.ck.i5, c6: !!this.state.ck.i6 },\n      ckToggle: (e) => {\n        const el = e.target.closest('[data-ck]');\n        if (!el) return;\n        const k = 'i' + el.getAttribute('data-ck');\n        const ck = { ...this.state.ck, [k]: !this.state.ck[k] };\n        this.setState({ ck });\n        this.writeStore({ ck2: ck, ckTotal: this.CK_TOTAL });\n      },\n      prevHref: L('W05 Lesson 1.dc.html'),\n      nextHref: L('W05 Lesson 3.dc.html')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
